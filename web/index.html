<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="HakbangHero — a gamified running and walking tracker.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hakbanghero">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>hakbanghero</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="bootstrap-status" role="status" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#060C06;color:white;font:600 16px sans-serif;text-align:center;padding:24px">
    <p>HAKBANGHERO</p>
    <p id="bootstrap-message">Loading your adventure...</p>
    <button id="bootstrap-retry" hidden onclick="location.reload()" style="padding:12px 24px;background:#00FF41;color:#060C06;border:0;border-radius:12px;font:700 16px sans-serif">RETRY</button>
  </div>
  <script>
    window.hakbangStartupError = function () {
      const message = document.getElementById('bootstrap-message');
      if (!message) return;
      message.textContent = 'Could not start the app. Check your connection and retry.';
      document.getElementById('bootstrap-retry').hidden = false;
    };
    const startupTimer = setTimeout(window.hakbangStartupError, 20000);
    window.addEventListener('flutter-first-frame', function () {
      clearTimeout(startupTimer);
      document.getElementById('bootstrap-status').remove();
    }, { once: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    (async function () {
      // Retire legacy Flutter cache workers before loading any app JavaScript.
      // Unregistering affects the next navigation; it does not clear Firebase
      // Auth, IndexedDB, saved runs, or any other user data.
      try {
        if ('serviceWorker' in navigator) {
          const isFlutterWorker = worker => worker &&
            new URL(worker.scriptURL).origin === location.origin &&
            new URL(worker.scriptURL).pathname.endsWith('/flutter_service_worker.js');
          const controlled = isFlutterWorker(navigator.serviceWorker.controller);
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const registration of registrations) {
            if (isFlutterWorker(registration.active) || isFlutterWorker(registration.waiting) ||
                isFlutterWorker(registration.installing)) await registration.unregister();
          }
          if (controlled) { location.reload(); return; }
        }
      } catch (error) {
        console.warn('Could not retire the previous app cache.', error);
      }
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.onerror = window.hakbangStartupError;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
